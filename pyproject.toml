[project]
name = "politika"
version = "0.1.0"
description = "Osobní přehled hlasování poslanců PSP ČR"
readme = "README.md"
authors = [
    { name = "Ypsilonx", email = "cibulect@seznam.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
politika = "politika.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
