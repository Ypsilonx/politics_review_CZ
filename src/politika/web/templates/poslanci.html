{% extends "base.html" %}
{% block title %}Poslanci – Sledování poslanců{% endblock %}
{% block content %}
<h1>Poslanci</h1>
<p class="tlumene">Poslanecká sněmovna, volební období od 2025.</p>
<label class="sr-only" for="hledat-poslance">Hledat poslance</label>
<input id="hledat-poslance" class="hledani-velke" type="search" name="q" value="{{ q }}"
       placeholder="Jméno nebo příjmení…" autofocus
       hx-get="/poslanci" hx-trigger="input changed delay:250ms, search"
       hx-target="#seznam" hx-push-url="true">
<div id="seznam">{% include "_poslanci_seznam.html" %}</div>
{% endblock %}
