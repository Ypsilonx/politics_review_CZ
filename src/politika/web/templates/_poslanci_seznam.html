<p class="tlumene mala">{{ poslanci | length }} poslanců</p>
<ul class="mrizka-poslancu">
  {% for p in poslanci %}
  <li>
    <a class="karta-poslance" href="/poslanec/{{ p.id_poslanec }}">
      {% if p.foto %}<img class="foto foto-mala" src="/foto/{{ p.id_osoba }}" alt="" width="42" height="56" loading="lazy">
      {% else %}<span class="avatar" aria-hidden="true">{{ p.jmeno[0] }}{{ p.prijmeni[0] }}</span>{% endif %}
      <span><span class="jmeno">{{ p.jmeno }}</span>
            <span class="tlumene mala">{{ p.klub or "nezařazený" }}</span></span>
    </a>
  </li>
  {% else %}
  <li class="tlumene">Žádný poslanec tomu neodpovídá. Zkus jen část příjmení.</li>
  {% endfor %}
</ul>
